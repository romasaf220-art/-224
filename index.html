<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER-IDLE: OVERLOAD v3.0</title>
    <style>
        :root { --bg: #050505; --panel: #0a0a0f; --accent: #00ff9d; --sec: #bd00ff; --warn: #ff0055; --text: #e0e0e0; --dim: #555; --font: 'Courier New', monospace; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: var(--text); font-family: var(--font); height: 100vh; overflow: hidden; display: flex; flex-direction: column; transition: background 0.5s, color 0.5s; }
        
        /* CRT Effect */
        .crt-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 999; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06)); background-size: 100% 2px, 3px 100%; animation: flicker 0.15s infinite; opacity: 0.8; }
        @keyframes flicker { 0% { opacity: 0.97; } 50% { opacity: 1; } 100% { opacity: 0.98; } }

        /* Themes */
        body.theme-matrix { --bg: #000; --panel: #001100; --accent: #00ff00; --sec: #008800; --text: #00ff00; --dim: #004400; }
        body.theme-amber { --bg: #110b00; --panel: #221500; --accent: #ffb000; --sec: #cc8800; --text: #ffb000; --dim: #664400; }
        body.theme-light { --bg: #f0f0f0; --panel: #ffffff; --accent: #0066cc; --sec: #cc0066; --text: #222; --dim: #999; --warn: #cc0000; }
        body.theme-light .crt-overlay { opacity: 0.1; }

        header { padding: 15px 20px; border-bottom: 1px solid var(--dim); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 10; }
        .currency-display { font-size: 1.8em; font-weight: bold; color: var(--accent); text-shadow: 0 0 10px rgba(0,255,157,0.3); }
        .rank-badge { padding: 5px 10px; border: 1px solid var(--sec); color: var(--sec); font-size: 0.8em; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.2s; }
        .theme-btn { background: transparent; border: 1px solid var(--dim); color: var(--dim); padding: 5px 10px; cursor: pointer; font-family: inherit; font-size: 0.8em; margin-left: 10px; }
        .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

        main { flex: 1; display: flex; overflow: hidden; }
        .terminal { width: 30%; min-width: 250px; background: var(--panel); border-right: 1px solid var(--dim); display: flex; flex-direction: column; padding: 10px; font-size: 0.8em; }
        .term-header { color: var(--dim); margin-bottom: 10px; border-bottom: 1px dashed var(--dim); padding-bottom: 5px; display: flex; justify-content: space-between; }
        .term-logs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .log-entry { opacity: 0.8; line-height: 1.4; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 0.8; transform: translateX(0); } }
        .log-entry.sys { color: var(--dim); } .log-entry.success { color: var(--accent); } .log-entry.warn { color: var(--warn); } .log-entry.rare { color: var(--sec); font-weight: bold; }

        .hack-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #particle-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
        
        /* CORE STYLES & SKINS */
        .core-btn { width: 200px; height: 200px; border-radius: 50%; border: 3px solid var(--accent); background: radial-gradient(circle, rgba(0,255,157,0.1) 0%, transparent 70%); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.05s; box-shadow: 0 0 30px rgba(0,255,157,0.2); position: relative; z-index: 2; overflow: hidden; }
        .core-btn:active { transform: scale(0.92); box-shadow: 0 0 60px rgba(0,255,157,0.6); }
        
        .core-icon { font-size: 4em; color: var(--accent); transition: all 0.3s; }
        
        /* Skin: AI Eye */
        .skin-eye .core-icon { font-size: 5em; color: var(--warn); animation: blink 4s infinite; text-shadow: 0 0 20px var(--warn); }
        @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
        
        /* Skin: Quantum Crystal */
        .skin-crystal .core-icon { font-size: 4em; color: var(--sec); animation: rotateCrystal 10s linear infinite; text-shadow: 0 0 30px var(--sec); }
        @keyframes rotateCrystal { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* Skin: Black Hole */
        .skin-hole { border-color: #fff; background: radial-gradient(circle, #000 30%, var(--sec) 70%); box-shadow: 0 0 50px var(--sec); }
        .skin-hole .core-icon { font-size: 0; } /* Hide icon, use background */
        .skin-hole::after { content: ''; position: absolute; inset: 10px; border-radius: 50%; border: 2px dashed #fff; animation: spin 2s linear infinite; }

        .upgrade-panel { width: 35%; min-width: 300px; background: var(--panel); border-left: 1px solid var(--dim); display: flex; flex-direction: column; }
        .tabs { display: flex; border-bottom: 1px solid var(--dim); }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; color: var(--dim); transition: 0.3s; font-weight: bold; }
        .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: rgba(0,255,157,0.05); }
        .panel-content { flex: 1; overflow-y: auto; padding: 15px; }
        
        .upg-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 12px; margin-bottom: 10px; border-radius: 4px; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .upg-card:hover { border-color: var(--accent); background: rgba(0,255,157,0.05); }
        .upg-card.locked { opacity: 0.4; filter: grayscale(1); pointer-events: none; }
        .upg-card.owned { border-color: var(--sec); background: rgba(189,0,255,0.1); }
        .upg-info h4 { color: var(--text); margin-bottom: 4px; font-size: 0.95em; }
        .upg-info p { color: var(--dim); font-size: 0.75em; }
        .upg-cost { color: var(--accent); font-weight: bold; text-align: right; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 80; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal { background: var(--panel); border: 1px solid var(--accent); padding: 30px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; box-shadow: 0 0 50px rgba(0,255,157,0.2); }
        .modal h2 { color: var(--accent); margin-bottom: 20px; border-bottom: 1px solid var(--dim); padding-bottom: 10px; }
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9em; }
        .stat-val { color: var(--accent); font-weight: bold; }
        .close-modal, .action-btn { margin-top: 20px; width: 100%; padding: 10px; background: transparent; border: 1px solid var(--dim); color: var(--dim); cursor: pointer; font-family: var(--font); transition: 0.2s; }
        .action-btn { border-color: var(--accent); color: var(--accent); margin-bottom: 10px; }
        .action-btn:hover { background: var(--accent); color: #000; }
        .close-modal:hover { border-color: var(--warn); color: var(--warn); }
        textarea { width: 100%; height: 100px; background: #000; color: var(--accent); border: 1px solid var(--dim); padding: 10px; font-family: var(--font); margin-top: 10px; resize: none; }

        @media (max-width: 900px) {
            main { flex-direction: column; }
            .terminal, .upgrade-panel { width: 100%; height: 30%; min-width: auto; border: none; border-bottom: 1px solid var(--dim); }
            .hack-zone { height: 40%; }
            .core-btn { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>
<div class="crt-overlay"></div>
<canvas id="particle-canvas"></canvas>

<header>
    <div>
        <div class="currency-display" id="btcDisplay">0 BTC</div>
        <div style="font-size: 0.7em; color: var(--dim); margin-top: 5px; display: flex; gap: 15px;">
            <span>HASH/s: <span id="hpsDisplay">0</span></span>
            <span>MULT: x<span id="multDisplay">1.0</span></span>
            <span style="cursor:pointer; color:var(--accent)" onclick="showStats()">[STATS]</span>
            <button class="theme-btn" onclick="cycleTheme()">[THEME]</button>
        </div>
    </div>
    <div class="rank-badge" id="rankBadge" onclick="handleRankClick()">SCRIPT KIDDIE</div>
</header>

<main>
    <div class="terminal">
        <div class="term-header"><span>>> SYSTEM_LOGS v3.0</span><span style="cursor:pointer" onclick="clearLogs()">[CLR]</span></div>
        <div class="term-logs" id="logs"></div>
    </div>
    <div class="hack-zone" id="hackZone">
        <div class="core-btn skin-default" id="coreBtn"><div class="core-icon">⌨️</div></div>
        <div style="margin-top: 20px; color: var(--dim); font-size: 0.8em;">[ CLICK TO INJECT CODE ]</div>
    </div>
    <div class="upgrade-panel">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('soft')">SOFTWARE</div>
            <div class="tab" onclick="switchTab('hard')">HARDWARE</div>
            <div class="tab" onclick="switchTab('skins')">SKINS</div>
        </div>
        <div class="panel-content" id="panelContent"></div>
    </div>
</main>

<!-- Stats Modal -->
<div class="modal-overlay" id="statsModal">
    <div class="modal">
        <h2>> USER_STATISTICS</h2>
        <div id="statsContent"></div>
        <button class="action-btn" onclick="exportSave()">EXPORT SAVE</button>
        <button class="action-btn" onclick="toggleImport()">IMPORT SAVE</button>
        <div id="importArea" style="display:none;">
            <textarea id="importInput" placeholder="Paste save string here..."></textarea>
            <button class="action-btn" onclick="importSave()">LOAD DATA</button>
        </div>
        <button class="close-modal" onclick="hideStats()">[ CLOSE_CONNECTION ]</button>
    </div>
</div>

<script>
/** CYBER-IDLE v3.0 ENGINE **/
const CFG = {
    ranks: [
        {name:'SCRIPT KIDDIE', req:0}, {name:'GREY HAT', req:10000}, 
        {name:'NETRUNNER', req:100000}, {name:'CYBER PUNK', req:1000000},
        {name:'SYSTEM ADMIN', req:50000000}, {name:'AI GOD', req:1000000000}
    ],
    themes: ['', 'theme-matrix', 'theme-amber', 'theme-light'],
    skins: [
        {id:'default', name:'Standard Core', icon:'⌨️', cost:0, class:'skin-default'},
        {id:'eye', name:'AI Eye', icon:'👁️', cost:500000, class:'skin-eye'},
        {id:'crystal', name:'Quantum Crystal', icon:'💎', cost:2000000, class:'skin-crystal'},
        {id:'hole', name:'Black Hole', icon:'🕳️', cost:10000000, class:'skin-hole'}
    ]
};

let state = {
    btc:0, totalBtc:0, clicks:0, startTime:Date.now(), lastSave:Date.now(),
    mult:1, rankIdx:0, prestige:0, godMode:false, themeIdx:0, rankClicks:0,
    currentSkin:'default', unlockedSkins:['default'],
    soft:[], hard:[], skills:[], stats:{crits:0, playTime:0}
};

let audioCtx, particles=[], currentTab='soft';

// --- AUDIO & PARTICLES ---
function initAudio(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }
function playSound(t){
    if(!audioCtx)return; const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination); const n=audioCtx.currentTime;
    if(t==='click'){o.frequency.setValueAtTime(800,n);o.frequency.exponentialRampToValueAtTime(300,n+0.1);g.gain.setValueAtTime(0.1,n);g.gain.exponentialRampToValueAtTime(0.01,n+0.1);o.start(n);o.stop(n+0.1);}
    if(t==='buy'){o.type='triangle';o.frequency.setValueAtTime(400,n);o.frequency.linearRampToValueAtTime(1200,n+0.15);g.gain.setValueAtTime(0.1,n);g.gain.exponentialRampToValueAtTime(0.01,n+0.2);o.start(n);o.stop(n+0.2);}
}

const canvas=document.getElementById('particle-canvas'), ctx=canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
window.addEventListener('resize',resize); resize();

class Particle{
    constructor(x,y,c){this.x=x;this.y=y;this.c=c;this.vx=(Math.random()-0.5)*6;this.vy=(Math.random()-0.5)*6;this.life=1;this.size=Math.random()*3+1;}
    update(){this.x+=this.vx;this.y+=this.vy;this.life-=0.03;this.size*=0.95;}
    draw(){ctx.globalAlpha=this.life;ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
}
function spawnP(x,y,c){for(let i=0;i<10;i++)particles.push(new Particle(x,y,c));}
function animP(){ctx.clearRect(0,0,canvas.width,canvas.height);particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.update();p.draw();});requestAnimationFrame(animP);}
animP();

// --- GAME LOGIC ---
function initData(){
    state.soft=['Ping Script','Port Scanner','Brute Force','DDoS Bot','Zero-Day','AI Net','Quantum Dec'].map((n,i)=>({id:`sw_${i}`,name:n,baseCost:Math.pow(15,i+1),baseHps:Math.pow(2.2,i)*5,count:0,mult:1.15}));
    state.hard=['Mech KB','GPU Cluster','Neural Link','Cyber Arm','Quantum Core'].map((n,i)=>({id:`hw_${i}`,name:n,baseCost:Math.pow(50,i+1),effect:i===0?'click':'mult',val:i===0?5:0.25,count:0,mult:1.3}));
    state.skills=[{id:'sk_crit',name:'Overclock',desc:'+15% Crit Chance',cost:50000,bought:false},{id:'sk_auto',name:'Auto-Injector',desc:'Auto-click/sec',cost:200000,bought:false}];
}

function getHPS(){return Math.floor(state.soft.reduce((s,u)=>s+(u.count*u.baseHps),0)*state.mult*(state.godMode?10:1));}
function getClickPower(){return Math.floor((1+Math.floor(getHPS()*0.05)+(state.hard[0]?.count*5||0))*state.mult*(state.godMode?10:1));}

function handleClick(e){
    initAudio(); let p=getClickPower();
    if(state.skills.find(s=>s.id==='sk_crit')?.bought && Math.random()<0.15){p*=3;state.stats.crits++;log('CRITICAL HIT!','rare');}
    else playSound('click');
    
    state.btc+=p; state.totalBtc+=p; state.clicks++;
    spawnP(e.clientX,e.clientY,'#00ff9d');
    updateUI(); checkRank();
}

function buy(type,idx){
    initAudio(); 
    if(type==='skins'){
        const skin=CFG.skins[idx];
        if(state.unlockedSkins.includes(skin.id)){
            state.currentSkin=skin.id;
            applySkin();
            log(`SKIN EQUIPPED: ${skin.name}`,'success');
        } else if(state.btc>=skin.cost){
            state.btc-=skin.cost;
            state.unlockedSkins.push(skin.id);
            state.currentSkin=skin.id;
            applySkin();
            log(`SKIN UNLOCKED: ${skin.name}`,'rare');
            playSound('buy');
        }
    } else {
        const list=type==='soft'?state.soft:(type==='hard'?state.hard:state.skills);
        const item=list[idx];
        if(item.bought!==undefined){
            if(!item.bought&&state.btc>=item.cost){state.btc-=item.cost;item.bought=true;log(`SKILL: ${item.name}`,'success');playSound('buy');if(item.id==='sk_auto')setInterval(()=>document.getElementById('coreBtn').click(),1000);}
        }else{
            const cost=Math.floor(item.baseCost*Math.pow(item.mult,item.count));
            if(state.btc>=cost){state.btc-=cost;item.count++;if(item.effect==='mult')state.mult+=item.val;log(`INSTALLED: ${item.name} v${item.count}`,'sys');playSound('buy');}
        }
    }
    renderPanel(currentTab); updateUI();
}

// --- UI & FEATURES ---
function switchTab(t){currentTab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));event.target.classList.add('active');renderPanel(t);}
function renderPanel(t){
    const c=document.getElementById('panelContent'); c.innerHTML='';
    
    if(t==='skins'){
        CFG.skins.forEach((skin,i)=>{
            const unlocked=state.unlockedSkins.includes(skin.id);
            const equipped=state.currentSkin===skin.id;
            const d=document.createElement('div');
            d.className=`upg-card ${!unlocked&&state.btc<skin.cost?'locked':''} ${equipped?'owned':''}`;
            d.onclick=()=>buy('skins',i);
            d.innerHTML=`<div class="upg-info"><h4>${skin.icon} ${skin.name}</h4><p>${unlocked?(equipped?'EQUIPPED':'Click to Equip'):`Unlock for ${fmt(skin.cost)} BTC`}</p></div>`;
            c.appendChild(d);
        });
    } else {
        const list=t==='soft'?state.soft:(t==='hard'?state.hard:state.skills);
        list.forEach((item,i)=>{
            const isSkill=item.bought!==undefined;
            const cost=isSkill?item.cost:Math.floor(item.baseCost*Math.pow(item.mult,item.count));
            const canAfford=state.btc>=cost; const owned=isSkill?item.bought:item.count>0;
            const d=document.createElement('div');
            d.className=`upg-card ${(!canAfford&&!owned)?'locked':''}`;
            d.onclick=()=>buy(t,i);
            d.innerHTML=`<div class="upg-info"><h4>${item.name}</h4><p>${isSkill?item.desc:(item.effect==='click'?'+Click Power':`+${item.baseHps} HPS`)}</p></div><div class="upg-cost">${isSkill&&owned?'OWNED':fmt(cost)}</div>`;
            c.appendChild(d);
        });
    }
}

function applySkin(){
    const btn=document.getElementById('coreBtn');
    const icon=btn.querySelector('.core-icon');
    const skinData=CFG.skins.find(s=>s.id===state.currentSkin);
    
    // Reset classes
    btn.className='core-btn';
    btn.classList.add(skinData.class);
    icon.innerText=skinData.icon;
}

function log(msg,type='sys'){
    const l=document.getElementById('logs'); const e=document.createElement('div');
    e.className=`log-entry ${type}`; e.innerText=`[${new Date().toLocaleTimeString()}] ${msg}`;
    l.prepend(e); if(l.children.length>50)l.lastChild.remove();
}
function clearLogs(){document.getElementById('logs').innerHTML='';log('Logs cleared.');}

function updateUI(){
    document.getElementById('btcDisplay').innerText=`${fmt(Math.floor(state.btc))} BTC`;
    document.getElementById('hpsDisplay').innerText=fmt(getHPS());
    document.getElementById('multDisplay').innerText=(state.mult*(state.godMode?10:1)).toFixed(1);
    const r=CFG.ranks[state.rankIdx];
    const badge=document.getElementById('rankBadge');
    badge.innerText=state.godMode?'GOD MODE ACTIVATED':r.name;
    badge.style.borderColor=state.godMode?'#fff':r.name==='SCRIPT KIDDIE'?'var(--sec)':'var(--accent)';
}
function fmt(n){if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return Math.floor(n).toString();}

function checkRank(){
    const next=CFG.ranks[state.rankIdx+1];
    if(next&&state.totalBtc>=next.req){state.rankIdx++;log(`RANK UP: ${next.name}`,'rare');}
}

// --- EASTER EGGS & THEMES ---
function cycleTheme(){
    state.themeIdx=(state.themeIdx+1)%CFG.themes.length;
    document.body.className=CFG.themes[state.themeIdx];
    log(`THEME: ${CFG.themes[state.themeIdx]||'DEFAULT'}`,'sys');
}

function handleRankClick(){
    state.rankClicks++;
    if(state.rankClicks>=10){
        state.godMode=!state.godMode;
        log(state.godMode?'GOD MODE ENABLED (x10 Income)':'GOD MODE DISABLED',state.godMode?'rare':'warn');
        state.rankClicks=0;
    }
}

// Konami Code
let konamiSeq=[]; const konamiCode=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
document.addEventListener('keydown',e=>{
    konamiSeq.push(e.key); if(konamiSeq.length>10)konamiSeq.shift();
    if(JSON.stringify(konamiSeq)===JSON.stringify(konamiCode)){
        state.godMode=!state.godMode;
        log('KONAMI CODE ACTIVATED!','rare');
        konamiSeq=[];
    }
});

// --- SAVE SYSTEM ---
function showStats(){
    const m=document.getElementById('statsModal');
    document.getElementById('statsContent').innerHTML=`
        <div class="stat-row"><span>Total Earned:</span><span class="stat-val">${fmt(state.totalBtc)} BTC</span></div>
        <div class="stat-row"><span>Clicks:</span><span class="stat-val">${state.clicks}</span></div>
        <div class="stat-row"><span>Crits:</span><span class="stat-val">${state.stats.crits}</span></div>
        <div class="stat-row"><span>Rank:</span><span class="stat-val">${CFG.ranks[state.rankIdx].name}</span></div>
        <div class="stat-row"><span>Current Skin:</span><span class="stat-val">${CFG.skins.find(s=>s.id===state.currentSkin).name}</span></div>
    `;
    m.style.display='flex';
}
function hideStats(){document.getElementById('statsModal').style.display='none';document.getElementById('importArea').style.display='none';}
function toggleImport(){document.getElementById('importArea').style.display=document.getElementById('importArea').style.display==='none'?'block':'none';}

function exportSave(){
    const str=btoa(JSON.stringify(state));
    navigator.clipboard.writeText(str).then(()=>log('SAVE COPIED TO CLIPBOARD','success')).catch(()=>{
        document.getElementById('importInput').value=str;
        log('COPY FAILED. USE MANUAL COPY.','warn');
    });
}
function importSave(){
    try{
        const str=document.getElementById('importInput').value.trim();
        if(!str)return;
        const data=JSON.parse(atob(str));
        state={...state,...data};
        initData(); // Restore structure
        state.soft.forEach((u,i)=>{if(data.soft[i])u.count=data.soft[i].count;});
        state.hard.forEach((u,i)=>{if(data.hard[i])u.count=data.hard[i].count;});
        state.skills.forEach((u,i)=>{if(data.skills[i])u.bought=data.skills[i].bought;});
        applySkin();
        log('SAVE LOADED SUCCESSFULLY','success');
        hideStats(); updateUI(); renderPanel(currentTab);
    }catch(e){log('INVALID SAVE STRING','warn');}
}

function saveGame(){state.lastSave=Date.now();localStorage.setItem('cyber_idle_v3',JSON.stringify(state));}
function loadGame(){
    const raw=localStorage.getItem('cyber_idle_v3');
    if(raw){try{const s=JSON.parse(raw);state={...state,...s};initData();state.soft.forEach((u,i)=>{if(s.soft[i])u.count=s.soft[i].count;});state.hard.forEach((u,i)=>{if(s.hard[i])u.count=s.hard[i].count;});state.skills.forEach((u,i)=>{if(s.skills[i])u.bought=s.skills[i].bought;});}catch(e){initData();}}
    else initData();
    
    // Offline
    const secs=(Date.now()-state.lastSave)/1000;
    if(secs>60){const earned=Math.floor(secs*getHPS()*0.5);state.btc+=earned;state.totalBtc+=earned;log(`OFFLINE: +${fmt(earned)} BTC`,'success');}
    
    if(state.themeIdx>0)document.body.className=CFG.themes[state.themeIdx];
    if(state.skills.find(s=>s.id==='sk_auto')?.bought)setInterval(()=>document.getElementById('coreBtn').click(),1000);
    applySkin();
    renderPanel('soft'); updateUI();
}

// --- INIT ---
document.getElementById('coreBtn').addEventListener('mousedown',handleClick);
document.getElementById('coreBtn').addEventListener('touchstart',(e)=>{e.preventDefault();handleClick(e.touches[0]);},{passive:false});

setInterval(()=>{const h=getHPS();if(h>0){state.btc+=h/10;state.totalBtc+=h/10;updateUI();}},100);
setInterval(saveGame,30000);

loadGame();
</script>
</body>
</html>
