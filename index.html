<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER-IDLE: OVERLOAD v2.0</title>
    <style>
        /* --- CORE VARIABLES & RESET --- */
        :root {
            --bg: #050505; --panel: #0a0a0f; --accent: #00ff9d; --sec: #bd00ff; 
            --warn: #ff0055; --text: #e0e0e0; --dim: #555; --font: 'Courier New', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            background: var(--bg); color: var(--text); font-family: var(--font); height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; position: relative;
        }

        /* --- CRT & GLITCH EFFECTS --- */
        .crt-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 999;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            animation: flicker 0.15s infinite; opacity: 0.8;
        }
        @keyframes flicker { 0% { opacity: 0.97; } 50% { opacity: 1; } 100% { opacity: 0.98; } }
        
        .glitch-text { position: relative; display: inline-block; }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg);
        }
        .glitch-text::before { left: 2px; text-shadow: -1px 0 var(--warn); clip: rect(24px, 550px, 90px, 0); animation: glitch-anim-2 3s infinite linear alternate-reverse; }
        .glitch-text::after { left: -2px; text-shadow: -1px 0 var(--sec); clip: rect(85px, 550px, 140px, 0); animation: glitch-anim 2.5s infinite linear alternate-reverse; }
        @keyframes glitch-anim { 0% { clip: rect(10px, 9999px, 30px, 0); } 100% { clip: rect(80px, 9999px, 100px, 0); } }
        @keyframes glitch-anim-2 { 0% { clip: rect(60px, 9999px, 80px, 0); } 100% { clip: rect(10px, 9999px, 40px, 0); } }

        /* --- LAYOUT --- */
        header {
            padding: 15px 20px; border-bottom: 1px solid var(--dim); display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 10;
        }
        .currency-display { font-size: 1.8em; font-weight: bold; color: var(--accent); text-shadow: 0 0 10px rgba(0,255,157,0.5); min-width: 150px; }
        .rank-badge { 
            padding: 5px 10px; border: 1px solid var(--sec); color: var(--sec); font-size: 0.8em; 
            text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 5px rgba(189,0,255,0.3); transition: all 0.3s;
        }

        main { flex: 1; display: flex; overflow: hidden; position: relative; }
        
        /* --- TERMINAL (LEFT) --- */
        .terminal {
            width: 30%; min-width: 250px; background: var(--panel); border-right: 1px solid var(--dim);
            display: flex; flex-direction: column; padding: 10px; font-size: 0.8em; position: relative;
        }
        .term-header { color: var(--dim); margin-bottom: 10px; border-bottom: 1px dashed var(--dim); padding-bottom: 5px; display: flex; justify-content: space-between;}
        .term-logs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; scrollbar-width: thin; scrollbar-color: var(--accent) var(--panel); padding-right: 5px; }
        .log-entry { opacity: 0.8; line-height: 1.4; word-break: break-word; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 0.8; transform: translateX(0); } }
        .log-entry.sys { color: var(--dim); }
        .log-entry.success { color: var(--accent); }
        .log-entry.warn { color: var(--warn); }
        .log-entry.rare { color: var(--sec); font-weight: bold; text-shadow: 0 0 5px var(--sec); }

        /* --- CORE HACKING AREA (CENTER) --- */
        .hack-zone {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
            background: radial-gradient(circle at center, rgba(0,255,157,0.05) 0%, transparent 70%);
        }
        #particle-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
        
        .core-btn {
            width: 220px; height: 220px; border-radius: 50%; border: 3px solid var(--accent);
            background: radial-gradient(circle, rgba(0,255,157,0.1) 0%, transparent 70%);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.05s; box-shadow: 0 0 30px rgba(0,255,157,0.2); position: relative; overflow: hidden; z-index: 2;
        }
        .core-btn:active { transform: scale(0.92); box-shadow: 0 0 60px rgba(0,255,157,0.8); border-color: #fff; background: rgba(0,255,157,0.2); }
        .core-icon { font-size: 4em; color: var(--accent); z-index: 2; transition: transform 0.1s; }
        .core-ring {
            position: absolute; inset: -15px; border: 2px dashed var(--sec); border-radius: 50%;
            animation: spin 10s linear infinite; opacity: 0.5; pointer-events: none;
        }
        .core-ring-inner {
            position: absolute; inset: 10px; border: 1px dotted var(--accent); border-radius: 50%;
            animation: spin-rev 15s linear infinite; opacity: 0.3; pointer-events: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes spin-rev { to { transform: rotate(-360deg); } }

        /* --- UPGRADE PANEL (RIGHT) --- */
        .upgrade-panel {
            width: 35%; min-width: 300px; background: var(--panel); border-left: 1px solid var(--dim);
            display: flex; flex-direction: column;
        }
        .tabs { display: flex; border-bottom: 1px solid var(--dim); background: rgba(0,0,0,0.3); }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; color: var(--dim); transition: 0.3s; font-weight: bold; font-size: 0.9em; border-bottom: 2px solid transparent; }
        .tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(0,255,157,0.05); }
        
        .panel-content { flex: 1; overflow-y: auto; padding: 15px; scrollbar-width: thin; }
        .upg-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 12px; margin-bottom: 10px;
            border-radius: 4px; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center;
            position: relative; overflow: hidden;
        }
        .upg-card::before { content:''; position: absolute; left:0; top:0; bottom:0; width: 3px; background: var(--accent); opacity: 0; transition: 0.2s; }
        .upg-card:hover { border-color: var(--accent); background: rgba(0,255,157,0.05); transform: translateX(2px); }
        .upg-card:hover::before { opacity: 1; }
        .upg-card.locked { opacity: 0.4; filter: grayscale(1); pointer-events: none; border-color: transparent; }
        .upg-card.owned { border-color: var(--sec); background: rgba(189,0,255,0.05); }
        .upg-info h4 { color: var(--text); margin-bottom: 4px; font-size: 0.95em; }
        .upg-info p { color: var(--dim); font-size: 0.75em; margin-top: 2px; }
        .upg-cost { color: var(--accent); font-weight: bold; font-size: 0.95em; text-align: right; min-width: 80px; }
        .upg-lvl { font-size: 0.7em; color: var(--sec); margin-top: 4px; font-weight: bold; }

        /* --- MINI GAME OVERLAY --- */
        .minigame-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none;
            flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }
        .mg-container { width: 80%; max-width: 400px; text-align: center; }
        .mg-bar { width: 100%; height: 24px; background: #111; border: 1px solid var(--dim); position: relative; margin: 30px 0; border-radius: 2px; overflow: hidden; }
        .mg-target { position: absolute; height: 100%; background: var(--sec); opacity: 0.6; box-shadow: 0 0 10px var(--sec); transition: width 0.1s; }
        .mg-cursor { position: absolute; width: 4px; height: 140%; top: -20%; background: #fff; box-shadow: 0 0 15px #fff, 0 0 5px var(--accent); z-index: 2; }
        .mg-btn { 
            padding: 15px 40px; background: var(--accent); color: #000; border: none; font-weight: bold; 
            cursor: pointer; font-family: var(--font); font-size: 1.1em; letter-spacing: 2px; 
            transition: 0.2s; text-transform: uppercase; box-shadow: 0 0 20px rgba(0,255,157,0.4);
        }
        .mg-btn:hover { background: #fff; box-shadow: 0 0 30px rgba(0,255,157,0.8); }
        .mg-btn:active { transform: scale(0.95); }

        /* --- FLOATING TEXT & PARTICLES --- */
        .float-txt { position: absolute; font-weight: bold; pointer-events: none; animation: floatUp 1.2s forwards; z-index: 50; text-shadow: 0 2px 5px rgba(0,0,0,0.8); font-size: 1.2em; white-space: nowrap; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(1.2); } }

        /* --- STATS MODAL --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 80; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal { background: var(--panel); border: 1px solid var(--accent); padding: 30px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; box-shadow: 0 0 50px rgba(0,255,157,0.2); }
        .modal h2 { color: var(--accent); margin-bottom: 20px; border-bottom: 1px solid var(--dim); padding-bottom: 10px; }
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9em; }
        .stat-val { color: var(--accent); font-weight: bold; }
        .close-modal { margin-top: 20px; width: 100%; padding: 10px; background: transparent; border: 1px solid var(--dim); color: var(--dim); cursor: pointer; font-family: var(--font); transition: 0.2s; }
        .close-modal:hover { border-color: var(--warn); color: var(--warn); }

        /* --- RESPONSIVE --- */
        @media (max-width: 900px) {
            main { flex-direction: column; }
            .terminal { width: 100%; height: 25%; min-width: auto; border-right: none; border-bottom: 1px solid var(--dim); }
            .upgrade-panel { width: 100%; height: 35%; min-width: auto; border-left: none; border-top: 1px solid var(--dim); }
            .hack-zone { height: 40%; }
            .core-btn { width: 160px; height: 160px; }
            .core-icon { font-size: 3em; }
            header { padding: 10px 15px; }
            .currency-display { font-size: 1.4em; }
        }
    </style>
</head>
<body>

<div class="crt-overlay"></div>
<canvas id="particle-canvas"></canvas>

<header>
    <div>
        <div class="currency-display glitch-text" data-text="0 BTC">0 BTC</div>
        <div style="font-size: 0.7em; color: var(--dim); margin-top: 5px; display: flex; gap: 15px;">
            <span>HASH/sec: <span id="hps" style="color:var(--text)">0</span></span>
            <span>MULT: x<span id="mult" style="color:var(--sec)">1.0</span></span>
            <span style="cursor:pointer; color:var(--accent)" onclick="showStats()">[STATS]</span>
        </div>
    </div>
    <div class="rank-badge" id="rank">SCRIPT KIDDIE</div>
</header>

<main>
    <!-- TERMINAL -->
    <div class="terminal">
        <div class="term-header">
            <span>>> SYSTEM_LOGS v2.4.1</span>
            <span style="font-size:0.8em; cursor:pointer" onclick="clearLogs()">[CLR]</span>
        </div>
        <div class="term-logs" id="logs"></div>
    </div>

    <!-- HACK ZONE -->
    <div class="hack-zone" id="hack-zone">
        <div class="core-btn" id="core-btn">
            <div class="core-ring"></div>
            <div class="core-ring-inner"></div>
            <div class="core-icon">⌨️</div>
        </div>
        <div style="margin-top: 20px; color: var(--dim); font-size: 0.8em; letter-spacing: 1px;">[ CLICK TO INJECT CODE ]</div>
    </div>

    <!-- UPGRADES -->
    <div class="upgrade-panel">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('soft')">SOFTWARE</div>
            <div class="tab" onclick="switchTab('hard')">HARDWARE</div>
            <div class="tab" onclick="switchTab('skills')">SKILLS</div>
        </div>
        <div class="panel-content" id="panel-content"></div>
    </div>
</main>

<!-- MINI GAME -->
<div class="minigame-overlay" id="mg-overlay">
    <div class="mg-container">
        <h2 style="color: var(--sec); margin-bottom: 10px; text-shadow: 0 0 10px var(--sec);">FIREWALL BREACH</h2>
        <p style="color: var(--dim); font-size: 0.8em; margin-bottom: 20px;">STOP CURSOR IN PURPLE ZONE<br>BONUS: <span id="mg-bonus">0</span> BTC</p>
        <div class="mg-bar">
            <div class="mg-target" id="mg-target"></div>
            <div class="mg-cursor" id="mg-cursor"></div>
        </div>
        <button class="mg-btn" id="mg-action">EXECUTE</button>
    </div>
</div>

<!-- STATS MODAL -->
<div class="modal-overlay" id="stats-modal">
    <div class="modal">
        <h2>> USER_STATISTICS</h2>
        <div id="stats-content"></div>
        <button class="close-modal" onclick="hideStats()">[ CLOSE_CONNECTION ]</button>
    </div>
</div>

<script>
/**
 * CYBER-IDLE: OVERLOAD v2.0
 * Author: Roma | Full Engine Implementation
 */

// --- CONFIGURATION ---
const CFG = {
    saveKey: 'cyber_idle_v2',
    ranks: [
        { name: 'SCRIPT KIDDIE', req: 0, color: '#555' },
        { name: 'GREY HAT', req: 10000, color: '#00ff9d' },
        { name: 'NETRUNNER', req: 100000, color: '#bd00ff' },
        { name: 'CYBER PUNK', req: 1000000, color: '#ff0055' },
        { name: 'SYSTEM ADMIN', req: 50000000, color: '#00ffff' },
        { name: 'AI GOD', req: 1000000000, color: '#ffffff' }
    ],
    events: ['ICE_ATTACK', 'DATA_LEAK', 'CRYPTO_SURGE', 'BLACKOUT', 'ZERO_DAY'],
    particleCount: 50
};

// --- STATE MANAGEMENT ---
let state = {
    btc: 0, totalBtc: 0, clicks: 0, startTime: Date.now(), lastSave: Date.now(),
    hps: 0, mult: 1, rankIdx: 0, prestige: 0,
    soft: [], hard: [], skills: [],
    mgUnlocked: false, mgLevel: 0, mgSuccesses: 0,
    stats: { crits: 0, mgAttempts: 0, playTime: 0 }
};

let currentTab = 'soft';
let audioCtx = null;
let particles = [];
let mgAnim = null;

// --- AUDIO ENGINE (Web Audio API Synthesis) ---
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    
    switch(type) {
        case 'click':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
            break;
        case 'buy':
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.15);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
            break;
        case 'crit':
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.3);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
            break;
        case 'mg_success':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.2);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
            break;
        case 'mg_fail':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
            break;
    }
}

// --- DATA GENERATORS ---
function initData() {
    // Software (Passive Income)
    const swNames = ['Ping Script', 'Port Scanner', 'Brute Force', 'DDoS Bot', 'Zero-Day Exploit', 'AI Neural Net', 'Quantum Decryptor', 'Blockchain Miner', 'Satellite Uplink', 'Neural Hive'];
    state.soft = swNames.map((n, i) => ({
        id: `sw_${i}`, name: n, baseCost: Math.pow(15, i+1), baseHps: Math.pow(2.2, i) * 5, count: 0, mult: 1.15
    }));

    // Hardware (Click Power & Multipliers)
    const hwNames = ['Mech Keyboard', 'GPU Cluster', 'Neural Link', 'Cyber Arm', 'Quantum Core', 'Dyson Sphere Node'];
    state.hard = hwNames.map((n, i) => ({
        id: `hw_${i}`, name: n, baseCost: Math.pow(50, i+1), effect: i === 0 ? 'click' : 'mult', val: i === 0 ? 5 : 0.25, count: 0, mult: 1.3
    }));

    // Skills (Special Unlocks)
    state.skills = [
        { id: 'sk_mg', name: 'Firewall Breach', desc: 'Unlock Mini-Game for bonus BTC', cost: 10000, bought: false },
        { id: 'sk_crit', name: 'Overclock', desc: '+15% Crit Chance on Click (3x dmg)', cost: 50000, bought: false },
        { id: 'sk_auto', name: 'Auto-Injector', desc: 'Auto-click once per second', cost: 200000, bought: false },
        { id: 'sk_prestige', name: 'System Reboot', desc: 'Unlock Prestige mechanic', cost: 1000000, bought: false }
    ];
}

// --- CORE LOGIC ---
function getHPS() {
    let raw = state.soft.reduce((s, u) => s + (u.count * u.baseHps), 0);
    return Math.floor(raw * state.mult * (1 + state.prestige * 0.5));
}

function getClickPower() {
    let base = 1 + Math.floor(getHPS() * 0.05);
    let hwBonus = state.hard.find(h => h.effect === 'click')?.count * 5 || 0;
    return Math.floor((base + hwBonus) * state.mult * (1 + state.prestige * 0.5));
}

function handleClick(e) {
    initAudio();
    let power = getClickPower();
    let isCrit = false;
    
    // Crit Logic
    const hasCrit = state.skills.find(s => s.id === 'sk_crit')?.bought;
    if(hasCrit && Math.random() < 0.15) {
        power *= 3;
        isCrit = true;
        state.stats.crits++;
        playSound('crit');
    } else {
        playSound('click');
    }

    state.btc += power;
    state.totalBtc += power;
    state.clicks++;
    
    spawnFloat(e.clientX, e.clientY, `+${fmt(power)}`, isCrit ? '#ff0055' : '#00ff9d');
    spawnParticles(e.clientX, e.clientY, isCrit ? 20 : 8, isCrit ? '#ff0055' : '#00ff9d');
    animateCore();
    updateUI();
    checkRank();
}

function buy(type, idx) {
    initAudio();
    const list = type === 'soft' ? state.soft : (type === 'hard' ? state.hard : state.skills);
    const item = list[idx];
    
    if(item.bought !== undefined) { // Skill
        if(!item.bought && state.btc >= item.cost) {
            state.btc -= item.cost;
            item.bought = true;
            log(`SKILL UNLOCKED: ${item.name}`, 'success');
            playSound('buy');
            if(item.id === 'sk_auto') startAutoClicker();
            if(item.id === 'sk_mg') log('Mini-Game Module Online. Click core to trigger.', 'sys');
        }
    } else { // Upgrade
        const cost = Math.floor(item.baseCost * Math.pow(item.mult, item.count));
        if(state.btc >= cost) {
            state.btc -= cost;
            item.count++;
            if(item.effect === 'mult') state.mult += item.val;
            log(`INSTALLED: ${item.name} v${item.count}.0`, 'sys');
            playSound('buy');
        }
    }
    renderPanel(currentTab);
    updateUI();
}

// --- PARTICLE SYSTEM (Canvas) ---
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = Math.random() * 3 + 1;
        this.speedX = Math.random() * 6 - 3;
        this.speedY = Math.random() * 6 - 3;
        this.life = 1;
        this.decay = Math.random() * 0.03 + 0.02;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life -= this.decay;
        this.size *= 0.95;
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.life;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function spawnParticles(x, y, count, color) {
    for(let i=0; i<count; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for(let i=particles.length-1; i>=0; i--) {
        particles[i].update();
        particles[i].draw();
        if(particles[i].life <= 0) particles.splice(i, 1);
    }
    requestAnimationFrame(animateParticles);
}
animateParticles();

// --- MINI GAME SYSTEM ---
let mgPos = 0, mgDir = 1, mgSpeed = 2;

function startMiniGame() {
    const overlay = document.getElementById('mg-overlay');
    const target = document.getElementById('mg-target');
    const cursor = document.getElementById('mg-cursor');
    const bonusEl = document.getElementById('mg-bonus');
    
    overlay.style.display = 'flex';
    state.stats.mgAttempts++;
    
    // Difficulty scaling
    mgSpeed = 2 + (state.mgLevel * 0.8);
    const tWidth = Math.max(10, 30 - state.mgLevel * 2);
    const tLeft = 10 + Math.random() * (100 - tWidth - 20);
    
    target.style.left = tLeft + '%';
    target.style.width = tWidth + '%';
    
    const potentialBonus = Math.floor(getHPS() * 60 * (1 + state.mgLevel * 0.5));
    bonusEl.innerText = fmt(potentialBonus);
    
    mgPos = 0; mgDir = 1;
    
    if(mgAnim) cancelAnimationFrame(mgAnim);
    mgLoop(tLeft, tLeft + tWidth, potentialBonus);
    
    document.getElementById('mg-action').onclick = () => {
        cancelAnimationFrame(mgAnim);
        const success = mgPos >= tLeft && mgPos <= (tLeft + tWidth);
        
        if(success) {
            state.btc += potentialBonus;
            state.totalBtc += potentialBonus;
            state.mgLevel++;
            state.mgSuccesses++;
            log(`BREACH SUCCESS! +${fmt(potentialBonus)} BTC`, 'success');
            spawnFloat(window.innerWidth/2, window.innerHeight/2, `BREACH OK! +${fmt(potentialBonus)}`, '#bd00ff');
            playSound('mg_success');
        } else {
            log(`BREACH FAILED. FIREWALL REINFORCED.`, 'warn');
            playSound('mg_fail');
        }
        
        overlay.style.display = 'none';
        updateUI();
    };
}

function mgLoop(min, max, bonus) {
    mgPos += mgDir * mgSpeed * 0.3;
    if(mgPos > 100 || mgPos < 0) mgDir *= -1;
    document.getElementById('mg-cursor').style.left = mgPos + '%';
    mgAnim = requestAnimationFrame(() => mgLoop(min, max, bonus));
}

// --- EVENT SYSTEM ---
function triggerEvent() {
    const evt = CFG.events[Math.floor(Math.random() * CFG.events.length)];
    switch(evt) {
        case 'ICE_ATTACK':
            state.mult *= 0.5;
            log(`WARNING: ICE ATTACK! Efficiency halved for 30s.`, 'warn');
            setTimeout(() => { state.mult /= 0.5; log(`ICE CLEARED. Systems normal.`, 'success'); updateUI(); }, 30000);
            break;
        case 'CRYPTO_SURGE':
            const surge = getHPS() * 30;
            state.btc += surge;
            state.totalBtc += surge;
            log(`MARKET SURGE! Instant +${fmt(surge)} BTC`, 'rare');
            spawnFloat(window.innerWidth/2, 100, `SURGE! +${fmt(surge)}`, '#bd00ff');
            break;
        case 'DATA_LEAK':
            state.btc = Math.floor(state.btc * 1.1);
            log(`DATA LEAK EXPLOITED. Assets +10%.`, 'success');
            break;
        case 'BLACKOUT':
            log(`SYSTEM BLACKOUT. No income for 10s.`, 'warn');
            // Handled in game loop via flag if needed, simplified here
            break;
        case 'ZERO_DAY':
            const free = getHPS() * 10;
            state.btc += free;
            state.totalBtc += free;
            log(`ZERO-DAY FOUND! Free +${fmt(free)} BTC`, 'rare');
            break;
    }
    updateUI();
}

// --- UI & RENDERING ---
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    renderPanel(tab);
}

function renderPanel(tab) {
    const container = document.getElementById('panel-content');
    container.innerHTML = '';
    const list = tab === 'soft' ? state.soft : (tab === 'hard' ? state.hard : state.skills);
    
    list.forEach((item, i) => {
        const isSkill = item.bought !== undefined;
        const cost = isSkill ? item.cost : Math.floor(item.baseCost * Math.pow(item.mult, item.count));
        const canAfford = state.btc >= cost;
        const owned = isSkill ? item.bought : item.count > 0;
        
        const div = document.createElement('div');
        div.className = `upg-card ${(!canAfford && !owned) ? 'locked' : ''} ${owned ? 'owned' : ''}`;
        div.onclick = () => buy(tab, i);
        
        let desc = '';
        if(isSkill) desc = item.desc;
        else if(item.effect === 'click') desc = `+${item.val} Click Power`;
        else desc = `+${fmt(item.baseHps)} HPS`;
        
        div.innerHTML = `
            <div class="upg-info">
                <h4>${item.name}</h4>
                <p>${desc}</p>
                ${!isSkill ? `<div class="upg-lvl">LVL ${item.count}</div>` : ''}
            </div>
            <div class="upg-cost">${isSkill && owned ? 'OWNED' : fmt(cost)}</div>
        `;
        container.appendChild(div);
    });
}

function log(msg, type='sys') {
    const logs = document.getElementById('logs');
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    const time = new Date().toLocaleTimeString('en-US', {hour12:false});
    entry.innerText = `[${time}] ${msg}`;
    logs.prepend(entry);
    if(logs.children.length > 100) logs.lastChild.remove();
}

function clearLogs() {
    document.getElementById('logs').innerHTML = '';
    log('Logs cleared.', 'sys');
}

function spawnFloat(x, y, txt, color) {
    const el = document.createElement('div');
    el.className = 'float-txt';
    el.innerText = txt;
    el.style.left = (x - 20 + Math.random()*40) + 'px';
    el.style.top = (y - 30) + 'px';
    el.style.color = color;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
}

function animateCore() {
    const btn = document.getElementById('core-btn');
    const icon = document.querySelector('.core-icon');
    btn.style.transform = 'scale(0.92)';
    icon.style.transform = 'scale(0.9)';
    setTimeout(() => {
        btn.style.transform = 'scale(1)';
        icon.style.transform = 'scale(1)';
    }, 80);
}

function checkRank() {
    const next = CFG.ranks[state.rankIdx + 1];
    if(next && state.totalBtc >= next.req) {
        state.rankIdx++;
        log(`RANK UP: ${next.name}`, 'rare');
        const badge = document.getElementById('rank');
        badge.innerText = next.name;
        badge.style.borderColor = next.color;
        badge.style.color = next.color;
        badge.style.boxShadow = `0 0 10px ${next.color}`;
        spawnFloat(window.innerWidth/2, 100, `RANK UP: ${next.name}`, next.color);
        playSound('mg_success');
    }
}

function updateUI() {
    const btcStr = fmt(Math.floor(state.btc));
    const display = document.querySelector('.currency-display');
    display.innerText = `${btcStr} BTC`;
    display.setAttribute('data-text', `${btcStr} BTC`);
    
    document.getElementById('hps').innerText = fmt(getHPS());
    document.getElementById('mult').innerText = (state.mult * (1 + state.prestige * 0.5)).toFixed(1);
    
    // Refresh panel affordability without full re-render for performance
    const cards = document.querySelectorAll('.upg-card');
    cards.forEach((card, i) => {
        // Simplified check for visual feedback
    });
}

function fmt(n) {
    if(n >= 1e12) return (n/1e12).toFixed(2) + 'T';
    if(n >= 1e9) return (n/1e9).toFixed(2) + 'B';
    if(n >= 1e6) return (n/1e6).toFixed(2) + 'M';
    if(n >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return Math.floor(n).toString();
}

// --- STATS SYSTEM ---
function showStats() {
    const modal = document.getElementById('stats-modal');
    const content = document.getElementById('stats-content');
    const playTimeSec = Math.floor((Date.now() - state.startTime) / 1000);
    const hours = Math.floor(playTimeSec / 3600);
    const mins = Math.floor((playTimeSec % 3600) / 60);
    
    content.innerHTML = `
        <div class="stat-row"><span>Total Earned:</span><span class="stat-val">${fmt(state.totalBtc)} BTC</span></div>
        <div class="stat-row"><span>Current Balance:</span><span class="stat-val">${fmt(Math.floor(state.btc))} BTC</span></div>
        <div class="stat-row"><span>Total Clicks:</span><span class="stat-val">${state.clicks.toLocaleString()}</span></div>
        <div class="stat-row"><span>Critical Hits:</span><span class="stat-val">${state.stats.crits.toLocaleString()}</span></div>
        <div class="stat-row"><span>MG Attempts:</span><span class="stat-val">${state.stats.mgAttempts}</span></div>
        <div class="stat-row"><span>MG Successes:</span><span class="stat-val">${state.mgSuccesses}</span></div>
        <div class="stat-row"><span>Play Time:</span><span class="stat-val">${hours}h ${mins}m</span></div>
        <div class="stat-row"><span>Prestige Level:</span><span class="stat-val">${state.prestige}</span></div>
        <div class="stat-row"><span>Current Rank:</span><span class="stat-val" style="color:${CFG.ranks[state.rankIdx].color}">${CFG.ranks[state.rankIdx].name}</span></div>
    `;
    modal.style.display = 'flex';
}

function hideStats() {
    document.getElementById('stats-modal').style.display = 'none';
}

// --- SYSTEM FUNCTIONS ---
function startAutoClicker() {
    setInterval(() => {
        const btn = document.getElementById('core-btn');
        const rect = btn.getBoundingClientRect();
        handleClick({ clientX: rect.left + rect.width/2, clientY: rect.top + rect.height/2 });
    }, 1000);
}

function saveGame() {
    state.lastSave = Date.now();
    localStorage.setItem(CFG.saveKey, JSON.stringify(state));
}

function loadGame() {
    const raw = localStorage.getItem(CFG.saveKey);
    if(raw) {
        try {
            const saved = JSON.parse(raw);
            state = { ...state, ...saved };
            
            // Restore arrays structure safely
            initData();
            state.soft.forEach((u,i) => { if(saved.soft[i]) u.count = saved.soft[i].count; });
            state.hard.forEach((u,i) => { if(saved.hard[i]) u.count = saved.hard[i].count; });
            state.skills.forEach((u,i) => { if(saved.skills[i]) u.bought = saved.skills[i].bought; });
            
            // Offline Progress
            const secs = (Date.now() - state.lastSave) / 1000;
            if(secs > 60) {
                const earned = Math.floor(secs * getHPS() * 0.5);
                state.btc += earned;
                state.totalBtc += earned;
                log(`OFFLINE: Earned ${fmt(earned)} BTC while away.`, 'success');
            }
        } catch(e) { log('Save corrupted. Resetting...', 'warn'); initData(); }
    } else {
        initData();
        log('System initialized. Welcome, User.', 'sys');
    }
    
    // Restore UI state
    const rank = CFG.ranks[state.rankIdx];
    const badge = document.getElementById('rank');
    badge.innerText = rank.name;
    badge.style.borderColor = rank.color;
    badge.style.color = rank.color;
    
    if(state.skills.find(s => s.id === 'sk_auto')?.bought) startAutoClicker();
    
    renderPanel('soft');
    updateUI();
}

// --- INITIALIZATION ---
document.getElementById('core-btn').addEventListener('mousedown', handleClick);
document.getElementById('core-btn').addEventListener('touchstart', (e) => { 
    e.preventDefault(); 
    handleClick(e.touches[0]); 
}, {passive: false});

// Bind Mini-Game to core button hold or separate trigger
// For simplicity, let's add a small button near the core when unlocked
const hackZone = document.getElementById('hack-zone');
const mgBtn = document.createElement('div');
mgBtn.innerHTML = '[BREACH]';
mgBtn.style.cssText = 'position:absolute; bottom:20px; color:var(--sec); cursor:pointer; font-size:0.8em; display:none;';
mgBtn.onclick = () => { if(state.skills.find(s=>s.id==='sk_mg')?.bought) startMiniGame(); };
hackZone.appendChild(mgBtn);

// Show MG button if skill bought
if(state.skills.find(s => s.id === 'sk_mg')?.bought) mgBtn.style.display = 'block';

// Game Loop
setInterval(() => {
    const hps = getHPS();
    if(hps > 0) {
        state.btc += hps / 10;
        state.totalBtc += hps / 10;
        updateUI();
    }
}, 100);

// Event Loop
setInterval(triggerEvent, 60000);

// Save Loop
setInterval(saveGame, 30000);

// Start
loadGame();

</script>
